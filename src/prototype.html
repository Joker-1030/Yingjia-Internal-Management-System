<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>英嘉科技内部管理系统 Current Prototype</title>
    <link rel="icon" href="data:," />
    <style>
/* @include "styles/prototype.css" */
    </style>
  </head>
  <body>
    <section id="loginView" class="login-shell">
      <div class="login-panel">
        <form class="login-card" id="loginForm">
          <div class="login-system">
            <div class="brand-mark">YJ</div>
            <div>
              <h1>英嘉科技内部管理系统</h1>
              <p>账号登录</p>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label"><span class="required-marker" aria-hidden="true">*</span>手机号</label
            ><input
              class="input"
              id="mobile"
              autocomplete="tel"
              inputmode="numeric"
              maxlength="11"
              pattern="1[3-9][0-9]{9}"
              value="13900000001"
              required
            />
          </div>
          <div class="form-group">
            <label class="form-label"><span class="required-marker" aria-hidden="true">*</span>密码</label
            ><div class="password-field"><input
                class="input"
                id="password"
                type="password"
                autocomplete="current-password"
                value="123456"
                required
              /><button class="password-toggle" id="passwordToggle" type="button" title="显示密码" aria-label="显示密码">◉</button></div>
          </div>
          <div class="form-group">
            <label class="form-label"><span class="required-marker" aria-hidden="true">*</span>图片验证码</label>
            <div class="captcha-row">
              <input
                class="input"
                id="captchaInput"
                autocomplete="off"
                maxlength="4"
                value="YJ26"
                required
              />
              <button
                class="captcha-image"
                id="captchaImage"
                type="button"
                title="演示验证码：YJ26"
                aria-label="演示图片验证码 YJ26"
              ></button>
            </div>
          </div>
          <button class="btn btn-primary login-btn" type="submit">
            登录系统
          </button>
          <div class="demo-accounts-title">演示账号 · 点击快速填充</div>
          <div class="account-grid" id="accountGrid"></div>
        </form>
      </div>
    </section>

    <section id="appView" class="app hidden">
      <aside class="sidebar">
        <div class="brand-lockup">
          <div class="brand-mark">YJ</div>
          <div>
            <div class="brand-name">英嘉管理</div>
            <div class="brand-sub">内部管理系统</div>
          </div>
        </div>
        <nav id="nav" class="nav"></nav>
        <div class="sidebar-foot">
          <div class="sidebar-account">
            <div class="avatar" id="profileAvatar">刘</div>
            <div class="sidebar-account-info">
              <div class="profile-name" id="profileName">刘总</div>
              <div class="profile-role" id="profileRole">总裁</div>
            </div>
          </div>
          <div class="sidebar-account-actions">
            <button
              class="icon-btn sidebar-action"
              id="profileBtn"
              title="个人信息"
              aria-label="个人信息"
            >
              <svg width="18" height="18" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M18.2838 43.1713C14.9327 42.1736 11.9498 40.3213 9.58787 37.867C10.469 36.8227 11 35.4734 11 34.0001C11 30.6864 8.31371 28.0001 5 28.0001C4.79955 28.0001 4.60139 28.01 4.40599 28.0292C4.13979 26.7277 4 25.3803 4 24.0001C4 21.9095 4.32077 19.8938 4.91579 17.9995C4.94381 17.9999 4.97188 18.0001 5 18.0001C8.31371 18.0001 11 15.3138 11 12.0001C11 11.0488 10.7786 10.1493 10.3846 9.35011C12.6975 7.1995 15.5205 5.59002 18.6521 4.72314C19.6444 6.66819 21.6667 8.00013 24 8.00013C26.3333 8.00013 28.3556 6.66819 29.3479 4.72314C32.4795 5.59002 35.3025 7.1995 37.6154 9.35011C37.2214 10.1493 37 11.0488 37 12.0001C37 15.3138 39.6863 18.0001 43 18.0001C43.0281 18.0001 43.0562 17.9999 43.0842 17.9995C43.6792 19.8938 44 21.9095 44 24.0001C44 25.3803 43.8602 26.7277 43.594 28.0292C43.3986 28.01 43.2005 28.0001 43 28.0001C39.6863 28.0001 37 30.6864 37 34.0001C37 35.4734 37.531 36.8227 38.4121 37.867C36.0502 40.3213 33.0673 42.1736 29.7162 43.1713C28.9428 40.752 26.676 39.0001 24 39.0001C21.324 39.0001 19.0572 40.752 18.2838 43.1713Z" fill="none" stroke="#000000" stroke-width="4" stroke-linejoin="round"/><path d="M24 31C27.866 31 31 27.866 31 24C31 20.134 27.866 17 24 17C20.134 17 17 20.134 17 24C17 27.866 20.134 31 24 31Z" fill="none" stroke="#000000" stroke-width="4" stroke-linejoin="round"/></svg>
            </button>
            <button
              class="icon-btn sidebar-action"
              id="noticeBtn"
              title="消息通知"
              aria-label="消息通知"
            >
              <svg
                width="18"
                height="18"
                viewBox="0 0 48 48"
                fill="none"
                aria-hidden="true"
              >
                <path
                  d="M24 4C16.268 4 10 10.268 10 18V38H38V18C38 10.268 31.732 4 24 4Z"
                  fill="none"
                />
                <path
                  d="M10 38V18C10 10.268 16.268 4 24 4C31.732 4 38 10.268 38 18V38M4 38H44"
                  stroke="currentColor"
                  stroke-width="4"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
                <path
                  d="M24 44C26.7614 44 29 41.7614 29 39V38H19V39C19 41.7614 21.2386 44 24 44Z"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="4"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
              <span class="notice-count hidden" aria-hidden="true"></span>
            </button>
            <button
              class="icon-btn sidebar-action"
              id="logoutBtn"
              title="退出登录"
              aria-label="退出登录"
            >
              <svg width="18" height="18" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M23.9917 6H6V42H24" stroke="#000000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M33 33L42 24L33 15" stroke="#000000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M16 23.9917H42" stroke="#000000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
          <div class="sidebar-version">Current Prototype</div>
        </div>
      </aside>
      <main class="main">
        <div id="content" class="content"></div>
      </main>
    </section>
    <div id="overlay"></div>
    <div id="modalLayer"></div>
    <div id="toast" class="toast hidden"></div>

    <script>
/* @include "app.js" */
    </script>
  </body>
</html>
