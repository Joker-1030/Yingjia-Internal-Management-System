name: Publish policy check

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  publish-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out candidate tree
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate public mirror policy and Prototype provenance
        run: node .github/scripts/check-publish-policy.mjs --all
